# grounding team MQTT broker
#
# Run from the host laptop (the one other teammates connect to):
#   mosquitto -c broker/mosquitto.conf -v
#
# Opens two listeners so both boards/CLI (raw TCP) and browser dashboards
# (WebSockets) can connect. Anonymous access, no username/password -
# fine for a hackathon LAN, do not reuse this config anywhere public.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
